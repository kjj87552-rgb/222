name: Build macOS Desktop Package

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/macos-package-*"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Build unsigned macOS package
        run: npm run desktop:build:mac

      - name: Upload macOS package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-package
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
